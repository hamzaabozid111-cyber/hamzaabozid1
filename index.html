<style id="profile-css">
/* Layout concept: a match-programme player card. A mown-pitch hero carries the name and a scoreboard of career totals,
   then a club-by-club ledger, then the certificates. The editor is a plain form kept apart from this card. */
:root{
  color-scheme:light;
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E2E9E3;
  --ink:#14271E; --ink-2:#4B5E53; --line:#C8D3CA;
  --pitch:#1D5A3B; --on-pitch:#FFFFFF;
  --accent:#B3261E; --on-accent:#FFFFFF;
  --hero-a:#14402F; --hero-b:#113626; --hero-ink:#F2F7F1; --hero-ink-2:#B7CDBF; --hero-accent:#FF9486; --hero-line:rgba(242,247,241,.22);
  --f-display:"Lalezar","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1612; --surface:#15221B; --surface-2:#1D2E25;
    --ink:#E7F0E9; --ink-2:#9CB0A3; --line:#2B4036;
    --pitch:#6BCB95; --on-pitch:#0A1E14;
    --accent:#FF8A7C; --on-accent:#1A0907;
    --hero-a:#133A2B; --hero-b:#103224;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1612; --surface:#15221B; --surface-2:#1D2E25;
  --ink:#E7F0E9; --ink-2:#9CB0A3; --line:#2B4036;
  --pitch:#6BCB95; --on-pitch:#0A1E14;
  --accent:#FF8A7C; --on-accent:#1A0907;
  --hero-a:#133A2B; --hero-b:#103224;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}

.pf-wrap{container-type:inline-size;max-width:62rem;margin-inline:auto}
.pf-wrap.sim{outline:1px dashed var(--line);outline-offset:10px}
.pf{display:flex;flex-direction:column;gap:2.5rem;font-family:var(--f-body);color:var(--ink)}
.pf *{box-sizing:border-box}

.pf-hero{border-radius:14px;overflow:hidden;color:var(--hero-ink);
  background:repeating-linear-gradient(90deg,var(--hero-a) 0 3.5rem,var(--hero-b) 3.5rem 7rem)}
.pf-hero-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15rem);gap:2rem;align-items:center;padding:clamp(1.25rem,4cqw,2.5rem)}
.pf-eyebrow{margin:0 0 .3rem;color:var(--hero-accent);font-weight:600;font-size:1rem}
.pf-name{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,7.5cqw,4rem);line-height:1.2;text-wrap:balance}
.pf-license{margin:.7rem 0 0;font-weight:600;font-size:1.0625rem}
.pf-focus{margin:.1rem 0 0;color:var(--hero-ink-2)}
.pf-contacts{list-style:none;margin:1.25rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;font-size:.9375rem}
.pf-contacts li{min-width:0;overflow-wrap:anywhere}
.pf-clabel{color:var(--hero-ink-2);margin-inline-end:.4rem}
.pf-mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pf-contacts a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.pf-portrait{margin:0;position:relative;width:100%;max-width:15rem;justify-self:center;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--hero-b)}
.pf-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;cursor:zoom-in}
.pf-portrait::after{content:"";position:absolute;inset:.6rem;border:2px solid rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
.pf-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:5rem;color:var(--hero-ink-2)}

.pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;border-top:1px solid var(--hero-line);background:rgba(0,0,0,.2)}
.pf-stat{display:flex;flex-direction:column-reverse;align-items:center;padding:.9rem .5rem;text-align:center;border-inline-start:1px solid var(--hero-line)}
.pf-stat:first-child{border-inline-start:0}

.pf-sec{display:flex;flex-direction:column;gap:1rem;scroll-margin-top:calc(var(--nav-top,0px) + 4.25rem)}
.pf [hidden],.pf-toast[hidden]{display:none!important}
.pf-h{display:flex;align-items:center;gap:.75rem;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,4cqw,1.75rem);line-height:1.3}
.pf-h::before{content:"";flex:none;width:.7em;height:.7em;border:2.5px solid var(--accent);border-radius:50%}
.pf-h::after{content:"";flex:1;height:1px;background:var(--line)}
.pf-p{margin:0 0 .6rem}

.pf-clubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pf-club{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:1.25rem;padding:1.1rem 0;border-top:1px solid var(--line)}

.pf-chead{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .75rem}

.pf-cstats b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:1.3rem;margin-inline-end:.3rem;font-variant-numeric:tabular-nums}
.pf-cstats .tot b{color:var(--pitch)}
.pf-note{margin:.4rem 0 0}
.pf-thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.pf-thumbs img{height:5.5rem;width:auto;max-width:100%;border-radius:6px;display:block;cursor:zoom-in;border:1px solid var(--line);background:var(--surface)}

.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.pf-grid.one{grid-template-columns:minmax(0,1fr)}
.pf-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pf-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;min-width:0}
.pf-card h3{margin:0;font-size:1.0625rem;line-height:1.55;font-weight:700}
.pf-card p{margin:.3rem 0 0;color:var(--ink-2);font-size:.9375rem}
.pf-card p.pf-issuer{color:var(--pitch);font-weight:600}
.pf-card p.pf-k{margin:0 0 .15rem;color:var(--accent);font-weight:600;font-size:.875rem}
.pf-card p.pf-txt{color:var(--ink);margin:0}
.pf-date{display:inline-block;margin-top:.55rem;font-size:.8125rem;font-weight:600;background:var(--surface-2);border-radius:999px;padding:.05rem .7rem}

.pf-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr));gap:.6rem}
.pf-gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}

.pf-lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,12,9,.9);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pf-lb[hidden]{display:none!important}
.pf-lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.pf-lb button{position:absolute;width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;font-family:var(--f-body)}
.pf-lb button:hover{background:rgba(255,255,255,.3)}
.pf-lb button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pf-lb-x{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
.pf-lb-n{top:50%;left:max(12px,env(safe-area-inset-left,0px));transform:translateY(-50%)}
.pf-lb-p{top:50%;right:max(12px,env(safe-area-inset-right,0px));transform:translateY(-50%)}
.pf-lb-c{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--f-mono);font-size:.9rem;pointer-events:none}
.pf-lb-c:empty{display:none}
.pf-thumbs img,.pf-gal img{transition:transform .2s ease,filter .2s ease}
.pf-thumbs img:hover,.pf-gal img:hover{transform:translateY(-2px);filter:brightness(1.06)}
.pf :focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.pf-hero :focus-visible{outline-color:var(--hero-ink)}

.pf-nav{position:sticky;top:var(--nav-top,env(safe-area-inset-top,0px));z-index:10;display:flex;gap:.4rem;align-items:center;overflow-x:auto;padding-block:.5rem;margin-top:-1rem;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.pf-nav::-webkit-scrollbar{display:none}
.pf-chip{flex:none;font:inherit;font-weight:600;font-size:.875rem;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .95rem;min-height:2.25rem;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.pf-chip:hover{background:var(--surface-2);color:var(--ink)}
.pf-chip[aria-pressed="true"],.pf-chip[aria-current="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.pf-theme{margin-inline-start:auto;font-size:1.05rem;padding-inline:.8rem}

.pf-copy{margin-inline-start:.5rem;font:inherit;font-size:.75rem;font-weight:600;color:var(--hero-ink);background:rgba(255,255,255,.14);border:1px solid var(--hero-line);border-radius:999px;padding:.05rem .7rem;cursor:pointer}

.pf-toast{position:fixed;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1.2rem;border-radius:999px;font-size:.9rem;font-family:var(--f-body);z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.25)}


.pf-vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.pf-vids.one{grid-template-columns:minmax(0,1fr);max-width:46rem}
.pf-vid{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.pf-vid h3{margin:0;font-size:1.0625rem;line-height:1.5}
.pf-vframe{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1511;border:1px solid var(--line)}
.pf-vframe iframe,.pf-vframe video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.pf-vplay{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;background-color:#0b1511;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.pf-vtri{position:relative;width:4.5rem;height:3.2rem;border-radius:.9rem;background:var(--accent);transition:transform .15s}
.pf-vtri::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-35%,-50%);border-style:solid;border-width:.7rem 0 .7rem 1.15rem;border-color:transparent transparent transparent var(--on-accent)}
.pf-vplay:hover .pf-vtri{transform:scale(1.1)}
.pf-vcard{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);background:var(--surface);font-size:.9rem;line-height:1.7;overflow:hidden}
.pf-vcard span{min-width:0;overflow-wrap:anywhere}

.pf-brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1.25rem;margin-bottom:-1.25rem;padding:.65rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pf-brand-id{display:flex;align-items:center;gap:.8rem;min-width:0}
.pf-brand-logo{height:2.75rem;width:auto;max-width:9rem;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.25rem;display:block}
.pf-brand-txt{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pf-brand-txt strong{font-size:1.0625rem}
.pf-brand-txt span{color:var(--ink-2);font-size:.875rem}
.pf-brand-ph{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .5rem;font-size:.9375rem}
.pf-brand-ph .pf-clabel{color:var(--ink-2);margin-inline-end:0}
.pf-brand-ph a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.pf-brand .pf-copy{color:var(--ink);background:var(--surface-2);border-color:var(--line);margin-inline-start:0}
.pf-brand .pf-copy:hover{background:var(--line)}
.pf-brand .pf-broken{min-height:2.5rem;min-width:0;max-width:12rem;font-size:.75rem;padding:.25rem .5rem}
@media (prefers-reduced-motion:reduce){.pf-chip,.pf-vtri,.pf-thumbs img,.pf-gal img{transition:none}}

.pf-broken{display:flex;align-items:center;justify-content:center;text-align:center;min-height:5.5rem;min-width:8rem;max-width:14rem;padding:.6rem;border:1px dashed var(--line);border-radius:6px;font-size:.8125rem;line-height:1.5;color:var(--ink-2);background:var(--surface)}

@media (min-width:80rem){ .pf-wrap{max-width:70rem} }
@media (min-width:100rem){ .pf-wrap{max-width:76rem} }
@container (min-width:64rem){
  .pf-hero-main{grid-template-columns:minmax(0,1fr) minmax(0,17rem);gap:3rem}
  .pf-club{grid-template-columns:9rem minmax(0,1fr)}

}
@container (min-width:72rem){ .pf-name{font-size:4.5rem} }
@container (max-width:42rem){ .pf-grid.three{grid-template-columns:minmax(0,1fr)} }

  .pf{gap:2rem}

  .pf-stat:nth-child(n+3){border-top:1px solid var(--hero-line)}
  .pf-grid{grid-template-columns:minmax(0,1fr)}
  .pf-club{grid-template-columns:minmax(0,1fr);gap:.2rem}

<style id="editor-css">
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.5rem;padding:.4rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center}

.main{max-width:62rem;margin:0 auto;padding-block:1.25rem 3rem}

.up{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:5.5rem;min-width:7rem;padding:.5rem 1rem;border:1.5px dashed var(--line);border-radius:8px;color:var(--ink-2);font-weight:600;cursor:pointer;text-align:center}
.up:hover{border-color:var(--pitch);color:var(--ink)}
.vh:focus-visible+.up,.vh:focus-visible+.btn{outline:2px solid var(--pitch);outline-offset:2px}
.prev-note{margin:0 0 1.25rem;color:var(--ink-2);font-size:.9rem}
.main.wide{max-width:90rem}
.photos{display:flex;flex-direction:column;gap:.75rem}
.urlrow{display:flex;flex-wrap:wrap;gap:.5rem}
.urlrow input{flex:1 1 14rem;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;min-height:2.5rem}
.item .urlrow input{background:var(--surface)}
.photo-box .pf-broken{border:0;max-width:none;min-width:0;width:100%;height:100%}
.devbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.9rem;color:var(--ink-2);font-size:.9rem}
.btn.small[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
@media (max-width:48rem){ .devbar{display:none} }

@media (max-width:40rem){ .fields{grid-template-columns:minmax(0,1fr)} .bar-title{font-size:1.15rem} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

function normalize(x){

  var o=Object.assign({},base,x||{});
  ['clubs','certs','academic','achievements','skills','gallery','videos'].forEach(function(k){ if(!Array.isArray(o[k])) o[k]=base[k]; });
  o.titles=Object.assign({},base.titles,(x&&x.titles)||{});
  o.clubs=o.clubs.map(function(c){ c=c||{}; return Object.assign({name:'',period:'',tag:'',goals:0,assists:0,note:'',photos:[]},c,{goals:Number(c.goals)||0,assists:Number(c.assists)||0,photos:Array.isArray(c.photos)?c.photos:[]}); });

  o.videos=o.videos.filter(function(v){return v&&typeof v==='object';}).map(function(v){return {title:String(v.title||''),url:String(v.url||'')};});

/* ---------- interactions (also embedded in the final file) ---------- */
function initProfile(){
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var behavior=reduce?'auto':'smooth';

  /* lightbox with next / previous inside a photo group */
  var box=document.createElement('div');
  box.className='pf-lb'; box.hidden=true;
  box.innerHTML='<img alt=""><button type="button" class="pf-lb-x" aria-label="إغلاق">×</button><button type="button" class="pf-lb-n" aria-label="التالي">‹</button><button type="button" class="pf-lb-p" aria-label="السابق">›</button><div class="pf-lb-c"></div>';
  document.body.appendChild(box);
  var im=box.querySelector('img'), cnt=box.querySelector('.pf-lb-c'), nb=box.querySelector('.pf-lb-n'), pb=box.querySelector('.pf-lb-p');
  var grp=[], idx=0;
  function show(){
    var t=grp[idx]; im.src=t.currentSrc||t.src;
    cnt.textContent=grp.length>1?(idx+1)+' / '+grp.length:'';
    nb.hidden=grp.length<2; pb.hidden=grp.length<2;
  }
  function open(t){
    var g=t.getAttribute('data-grp');
    grp=g?$$('img[data-zoom][data-grp="'+g+'"]'):[t];
    idx=Math.max(0,grp.indexOf(t)); show(); box.hidden=false;
  }
  function step(d){ if(grp.length<2) return; idx=(idx+d+grp.length)%grp.length; show(); }
  var x0=null;
  box.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  box.addEventListener('touchend',function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50) step(dx>0?1:-1);
  },{passive:true});

  /* images that fail to load from a link */
  function swap(t){
    var s=document.createElement('span'); s.className='pf-broken';
    s.textContent=window.__brokenMsg||'تعذّر تحميل الصورة من الرابط';
    t.replaceWith(s);
  }
  function sweep(){
    $$('img[data-remote]').forEach(function(i){ if(i.complete&&i.naturalWidth===0) swap(i); });
  }
  document.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t.tagName==='IMG'&&t.hasAttribute('data-remote')) swap(t);
  },true);

  /* small toast + copy */
  var tTimer=null;
  function toast(m){
    var t=document.querySelector('.pf-toast');
    if(!t){ t=document.createElement('div'); t.className='pf-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
    t.textContent=m; t.hidden=false;
    clearTimeout(tTimer); tTimer=setTimeout(function(){ t.hidden=true; },1800);
  }
  function copy(v){
    function ok(){ toast('تم النسخ'); }
    function fb(){
      try{
        var ta=document.createElement('textarea'); ta.value=v; ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta); ta.select();
        var r=document.execCommand('copy'); document.body.removeChild(ta);
        if(r) ok(); else toast('تعذّر النسخ');
      }catch(e){ toast('تعذّر النسخ'); }
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(ok,fb); } else { fb(); }
  }

  /* stat counters */
  function countUp(){
    $$('.pf-stat dd[data-count]').forEach(function(d){
      var to=+d.getAttribute('data-count')||0;
      if(reduce||to===0){ d.textContent=to; return; }
      var t0=null, dur=800;
      function f(ts){
        if(t0===null) t0=ts;
        var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
        d.textContent=Math.round(to*e);
        if(p<1) requestAnimationFrame(f); else d.textContent=to;
      }
      d.textContent='0'; requestAnimationFrame(f);
      setTimeout(function(){ d.textContent=to; },dur+400);
    });
  }

  /* section nav: highlight the section being read */
  var lastAct=null;
  function spy(){
    var nav=document.querySelector('.pf-nav'); if(!nav) return;
    var secs=$$('.pf-sec[id]'); if(!secs.length) return;
    var line=nav.getBoundingClientRect().bottom+16, cur=null;
    secs.forEach(function(s){ if(s.getBoundingClientRect().top<=line) cur=s.id; });
    if(window.innerHeight+window.pageYOffset>=document.documentElement.scrollHeight-4) cur=secs[secs.length-1].id;
    $$('.pf-nav [data-nav]').forEach(function(b){
      if(b.getAttribute('data-nav')===cur) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current');
    });
    var act=nav.querySelector('[aria-current="true"]');
    if(act&&act!==lastAct){
      lastAct=act;
      var nr=nav.getBoundingClientRect(), ar=act.getBoundingClientRect();
      if((ar.left<nr.left||ar.right>nr.right)&&nav.scrollBy) nav.scrollBy({left:(ar.left+ar.right)/2-(nr.left+nr.right)/2,behavior:behavior});
    }
  }
  var raf=0;
  function onScroll(){ if(raf) return; raf=requestAnimationFrame(function(){ raf=0; spy(); }); }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll);

  function run(){ lastAct=null; countUp(); sweep(); spy(); }
  window.__pfRefresh=run;

  document.addEventListener('click',function(e){
    var t=e.target; if(!t||!t.closest) return;
    if(!box.hidden){
      if(t===box||t.closest('.pf-lb-x')) box.hidden=true;
      else if(t.closest('.pf-lb-n')) step(1);
      else if(t.closest('.pf-lb-p')) step(-1);
      return;
    }
    if(t.matches('img[data-zoom]')){ open(t); return; }
    var b;
    if((b=t.closest('[data-nav]'))){
      var s=document.getElementById(b.getAttribute('data-nav'));
      if(s) s.scrollIntoView({behavior:behavior,block:'start'});
      return;
    }
    if((b=t.closest('[data-copy]'))){ copy(b.getAttribute('data-copy')); return; }
    if((b=t.closest('[data-yt]'))){
      var yid=b.getAttribute('data-yt');
      if(/^[\w-]{11}$/.test(yid)){
        var fr=document.createElement('iframe');
        fr.src='https://www.youtube-nocookie.com/embed/'+yid+'?autoplay=1&rel=0';
        fr.title='فيديو'; fr.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; fr.allowFullscreen=true;
        b.parentNode.replaceChild(fr,b);
      }
      return;
    }
    if(t.closest('[data-theme-toggle]')){
      var el=document.documentElement, cur=el.getAttribute('data-theme');
      var dark=cur==='dark'||(!cur&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      el.setAttribute('data-theme',dark?'light':'dark');
    }
  });
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(!box.hidden){
      if(e.key==='Escape') box.hidden=true;
      else if(e.key==='ArrowLeft') step(1);
      else if(e.key==='ArrowRight') step(-1);
      return;
    }
    if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('img[data-zoom]')){ e.preventDefault(); open(t); }
  });

  run();
  window.addEventListener('load',function(){ sweep(); spy(); });
}

function videoInfo(u){
  u=String(u||'').trim();
  if(!/^https?:\/\/[^\s"'<>]+$/i.test(u)) return null;
  var m;
  if((m=/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i.exec(u))) return {k:'yt',id:m[1]};
  if((m=/vimeo\.com\/(?:video\/)?(\d+)/i.exec(u))) return {k:'vimeo',id:m[1]};
  if((m=/drive\.google\.com\/file\/d\/([\w-]+)/i.exec(u))) return {k:'drive',id:m[1]};
  if(/facebook\.com|fb\.watch/i.test(u)) return {k:'fb'};
  if(/\.(mp4|webm|ogv|mov)(\?|#|$)/i.test(u)) return {k:'file'};
  return {k:'link'};
}

/* ---------- status + storage ---------- */
var st=$('#status');
function say(m){ st.textContent=m||''; }

var DB_NAME='player-profile-hawash', KEY='state-v1';
function idb(){return new Promise(function(res,rej){ try{ var r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=function(){r.result.createObjectStore('kv');}; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }catch(e){rej(e);} });}
function loadSaved(){
  return idb().then(function(db){return new Promise(function(res,rej){ var q=db.transaction('kv').objectStore('kv').get(KEY); q.onsuccess=function(){res(q.result||null);}; q.onerror=function(){rej(q.error);}; });})
    .catch(function(){ try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(_){ return null; } });
}
function persist(s){
  return idb().then(function(db){return new Promise(function(res,rej){ var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(clone(s),KEY); t.oncomplete=function(){res(true);}; t.onerror=function(){rej(t.error);}; t.onabort=function(){rej(t.error);}; });})
    .catch(function(){ try{ localStorage.setItem(KEY,JSON.stringify(s)); return true; }catch(_){ return false; } });
}
var ready=false, timer=null;
function touch(extra){
  if(!ready) return;
  say('جارٍ الحفظ…');
  clearTimeout(timer);
  timer=setTimeout(function(){
    persist(state).then(function(ok){
      say((extra?extra+' — ':'')+(ok?'تم حفظ التعديلات على هذا الجهاز':'تعذّر الحفظ التلقائي في هذا المتصفح. احفظ نسخة احتياطية من آخر الصفحة.'));
    });
  },600);
}

/* ---------- images ---------- */
function shrink(file,max,png){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(fr.error);};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('img'));};
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*sc)), h=Math.max(1,Math.round(im.naturalHeight*sc));
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var x=c.getContext('2d'); if(!png){ x.fillStyle='#fff'; x.fillRect(0,0,w,h); } x.drawImage(im,0,0,w,h);
        try{ res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.84)); }catch(err){ rej(err); }
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

var dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(function(){return null;}):Promise.resolve(null);
dlP.then(function(d){ if(!d) $('#copy').hidden=false; });
function fileName(ext){
  var n=String(state.name||'').replace(/[\\\/:*?"<>|\s]+/g,'-').replace(/^-+|-+$/g,'')||'player-profile';
  return n+'.'+ext;
}
function dlError(e){
  var c=e&&e.code;
  if(c==='declined') return 'تم إلغاء الحفظ. بياناتك محفوظة، ويمكنك المحاولة مرة أخرى.';
  if(c==='rate_limited') return 'انتظر لحظة ثم اضغط مرة أخرى.';
  if(c==='too_large') return 'الملف كبير جداً. احذف بعض الصور أو قلّل عددها ثم جرّب.';
  if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){ $('#copy').hidden=false; return 'التحميل المباشر غير متاح في هذا العرض. استخدم زر نسخ الكود.'; }
  return 'تعذّر تجهيز التحميل. حاول مرة أخرى.';
}
async function saveOut(filename,data,okMsg){
  var d=await dlP;
  if(!d){ $('#copy').hidden=false; say('التحميل المباشر غير متاح في هذا العرض. استخدم زر نسخ الكود.'); return; }
  try{ var r=await d.save({filename:filename,data:data}); say(r&&r.status==='saved'?okMsg:'تم إرسال الملف.'); }
  catch(e){ say(dlError(e)); }
}
async function makeFinal(){
  var b=$('#dl'); b.disabled=true; say('جارٍ تجهيز الملف…');

document.addEventListener('input',function(e){
  var t=e.target;
  if(!t||!t.dataset||!t.dataset.p||(t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA')||t.type==='file') return;
  var v=t.value;
  if(t.dataset.num) v=Math.max(0,parseInt(v,10)||0);
  setPath(state,t.dataset.p,v);
  var m=/^(\w+)\.(\d+)\.(\w+)$/.exec(t.dataset.p);
  if(m){
    var L=LISTS[m[1]];
    if(L&&L.key===m[3]){ var el=document.getElementById('it-'+m[1]+'-'+m[2]); if(el) el.textContent=v||L.empty; }
    if(m[1]==='videos'&&m[3]==='url'){ var vk=document.getElementById('vk-'+m[2]); if(vk) vk.textContent=vlabel(v); }
    if(m[1]==='clubs'&&(m[3]==='goals'||m[3]==='assists')){ var c=state.clubs[m[2]]; var ce=document.getElementById('calc-clubs-'+m[2]); if(ce) ce.textContent=(+c.goals||0)+(+c.assists||0); }
  }
  touch();
});

document.addEventListener('change',async function(e){
  var t=e.target;
  if(!t||!t.matches) return;
  if(t.matches('input[data-up]')){
    var files=Array.prototype.slice.call(t.files||[]); var path=t.dataset.up; t.value='';
    if(!files.length) return;
    say('جارٍ تجهيز الصور…');
    var out=[], bad=0;
    for(var i=0;i<files.length;i++){ try{ out.push(await shrink(files[i],path==='photo'?1000:(path==='brand.logo'?700:1100),path==='brand.logo')); }catch(_){ bad++; } }
    if(out.length){
      var cur=getPath(state,path); if(Array.isArray(cur)) cur.push.apply(cur,out); else setPath(state,path,out[0]);
      renderEditor();
    }
    ready?touch(bad?bad+' صورة لم تُقرأ (جرّب JPG أو PNG)':''):0;
    if(!out.length&&bad) say('لم يتم قراءة الصور. جرّب صيغة JPG أو PNG.');
  } else if(t.matches('input[data-imp]')){
    var f=t.files&&t.files[0]; t.value='';
    if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var j=JSON.parse(fr.result); var data=(j&&j.state)||j;
        if(!data||!Array.isArray(data.clubs)) throw new Error('bad');
        state=normalize(data); renderEditor(); touch('تم استرجاع النسخة الاحتياطية');
      }catch(_){ say('هذا الملف ليس نسخة احتياطية صالحة.'); }
    };
    fr.onerror=function(){ say('تعذّرت قراءة الملف.'); };
    fr.readAsText(f);
  }
});

document.addEventListener('click',function(e){
  var tb=e.target.closest&&e.target.closest('[data-view]');
  if(tb){ setView(tb.dataset.view); return; }
  var db=e.target.closest&&e.target.closest('[data-dev]');
  if(db){ devW=+db.dataset.dev||0; applyDev(); return; }
  var b=e.target.closest&&e.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.confirm&&!b.classList.contains('arm')){ arm(b); return; }
  var act=b.dataset.act, list=b.dataset.list, i=parseInt(b.dataset.i,10);
  if(act==='add'){
    state[list].push(LISTS[list].add()); renderEditor(); touch();
    var el=document.getElementById(fid(list+'.'+(state[list].length-1)+'.'+LISTS[list].key)); if(el) el.focus();
  } else if(act==='del'){ state[list].splice(i,1); renderEditor(); touch(); }
  else if(act==='up'||act==='down'){
    var a=state[list], j=act==='up'?i-1:i+1;
    if(j>=0&&j<a.length){ var tmp=a[i]; a[i]=a[j]; a[j]=tmp; renderEditor(); touch(); }
  } else if(act==='add-url'){
    var up=b.dataset.p; var inp=document.getElementById('url-'+up.replace(/\./g,'-')); var u=normUrl(inp&&inp.value);
    if(!/^https?:\/\/[^\s"'<>]+$/i.test(u)){ say('الرابط لازم يبدأ بـ https:// ويكون رابطاً مباشراً للصورة.'); if(inp) inp.focus(); return; }
    var cv=getPath(state,up); if(Array.isArray(cv)) cv.push(u); else setPath(state,up,u);
    renderEditor(); touch('تمت إضافة الصورة بالرابط');
  } else if(act==='rm-img'){ getPath(state,b.dataset.p).splice(i,1); renderEditor(); touch(); }
  else if(act==='clear-photo'){ state.photo=''; renderEditor(); touch(); }
  else if(act==='clear-logo'){ state.brand.logo=''; renderEditor(); touch(); }
  else if(act==='reset'){ state=clone(DEFAULT); renderEditor(); touch('تمت إعادة البيانات الأصلية'); }
  else if(act==='backup'){ saveOut(fileName('json'),JSON.stringify({app:'player-profile',v:1,state:state}),'تم حفظ النسخة الاحتياطية على جهازك.'); }
  else if(act==='download'){ makeFinal(); }
  else if(act==='copy'){ copyFinal(); }
});

document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t&&t.matches&&t.matches('input[data-url]')){
    e.preventDefault();
    var btn=t.parentNode.querySelector('[data-act="add-url"]'); if(btn) btn.click();
  }
});

/* ---------- start ---------- */
window.__brokenMsg='الصورة بالرابط تظهر في الملف النهائي بعد التحميل';
initProfile();
renderEditor();
if(window.ResizeObserver&&$('.bar')) new ResizeObserver(setNavTop).observe($('.bar'));
loadSaved().then(function(saved){
  if(saved&&typeof saved==='object'){
    try{ state=normalize(saved); renderEditor(); if(view==='preview') renderPreview(); say('تم استرجاع آخر نسخة محفوظة على هذا الجهاز.'); }catch(_){}
  }
  ready=true;
});
})();
</script>
