<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملف أحمد وجيه يوسف حواش</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Lalezar&family=Oswald:wght@400;500;600&display=swap"><style>
/* Layout concept: a match-programme player card. A mown-pitch hero carries the name and a scoreboard of career totals,
   then a club-by-club ledger, then the certificates. The editor is a plain form kept apart from this card. */
:root{
  color-scheme:light;
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E2E9E3;
  --ink:#14271E; --ink-2:#4B5E53; --line:#C8D3CA;
  --pitch:#1D5A3B; --on-pitch:#FFFFFF;
  --accent:#B3261E; --on-accent:#FFFFFF;
  --hero-a:#14402F; --hero-b:#113626; --hero-ink:#F2F7F1; --hero-ink-2:#B7CDBF; --hero-accent:#FF9486; --hero-line:rgba(242,247,241,.22);
  --f-display:"Lalezar","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1612; --surface:#15221B; --surface-2:#1D2E25;
    --ink:#E7F0E9; --ink-2:#9CB0A3; --line:#2B4036;
    --pitch:#6BCB95; --on-pitch:#0A1E14;
    --accent:#FF8A7C; --on-accent:#1A0907;
    --hero-a:#133A2B; --hero-b:#103224;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1612; --surface:#15221B; --surface-2:#1D2E25;
  --ink:#E7F0E9; --ink-2:#9CB0A3; --line:#2B4036;
  --pitch:#6BCB95; --on-pitch:#0A1E14;
  --accent:#FF8A7C; --on-accent:#1A0907;
  --hero-a:#133A2B; --hero-b:#103224;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}

.pf-wrap{container-type:inline-size;max-width:62rem;margin-inline:auto}
.pf-wrap.sim{outline:1px dashed var(--line);outline-offset:10px}
.pf{display:flex;flex-direction:column;gap:2.5rem;font-family:var(--f-body);color:var(--ink)}
.pf *{box-sizing:border-box}

.pf-hero{border-radius:14px;overflow:hidden;color:var(--hero-ink);
  background:repeating-linear-gradient(90deg,var(--hero-a) 0 3.5rem,var(--hero-b) 3.5rem 7rem)}
.pf-hero-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15rem);gap:2rem;align-items:center;padding:clamp(1.25rem,4cqw,2.5rem)}
.pf-eyebrow{margin:0 0 .3rem;color:var(--hero-accent);font-weight:600;font-size:1rem}
.pf-name{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,7.5cqw,4rem);line-height:1.2;text-wrap:balance}
.pf-license{margin:.7rem 0 0;font-weight:600;font-size:1.0625rem}
.pf-focus{margin:.1rem 0 0;color:var(--hero-ink-2)}
.pf-contacts{list-style:none;margin:1.25rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;font-size:.9375rem}
.pf-contacts li{min-width:0;overflow-wrap:anywhere}
.pf-clabel{color:var(--hero-ink-2);margin-inline-end:.4rem}
.pf-mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pf-contacts a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.pf-portrait{margin:0;position:relative;width:100%;max-width:15rem;justify-self:center;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--hero-b)}
.pf-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;cursor:zoom-in}
.pf-portrait::after{content:"";position:absolute;inset:.6rem;border:2px solid rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
.pf-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:5rem;color:var(--hero-ink-2)}

.pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;border-top:1px solid var(--hero-line);background:rgba(0,0,0,.2)}
.pf-stat{display:flex;flex-direction:column-reverse;align-items:center;padding:.9rem .5rem;text-align:center;border-inline-start:1px solid var(--hero-line)}
.pf-stat:first-child{border-inline-start:0}
.pf-stat dd{margin:0;font-family:var(--f-display);font-size:clamp(1.9rem,6cqw,2.75rem);line-height:1.1;font-variant-numeric:tabular-nums}
.pf-stat dt{color:var(--hero-ink-2);font-size:.875rem}

.pf-sec{display:flex;flex-direction:column;gap:1rem;scroll-margin-top:calc(var(--nav-top,0px) + var(--brand-h,0px) + 4.25rem)}
.pf [hidden],.pf-toast[hidden]{display:none!important}
.pf-h{display:flex;align-items:center;gap:.75rem;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,4cqw,1.75rem);line-height:1.3}
.pf-h::before{content:"";flex:none;width:.7em;height:.7em;border:2.5px solid var(--accent);border-radius:50%}
.pf-h::after{content:"";flex:1;height:1px;background:var(--line)}
.pf-p{margin:0 0 .6rem}
.pf-sum{margin:0;max-width:46rem;font-size:1.0625rem;line-height:1.95}

.pf-clubs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.pf-club{display:flex;flex-direction:column;gap:.6rem;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
.pf-chead{display:flex;align-items:center;gap:.85rem;min-width:0}
.pf-cphotos{display:flex;flex-wrap:wrap;gap:.35rem;flex:none;max-width:8.2rem}
.pf-cphotos img{width:3.9rem;height:3.9rem;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.2rem;display:block;cursor:zoom-in}
.pf-cphotos .pf-broken{min-width:0;min-height:0;width:3.9rem;height:3.9rem;padding:.1rem;font-size:.55rem}
.pf-ctitle{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem}
.pf-ctitle h3{margin:0;font-size:1.15rem;font-weight:700;line-height:1.4}
.pf-when{font-family:var(--f-mono);font-size:.8125rem;color:var(--ink-2)}
.pf-tag{font-size:.8125rem;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:.05rem .7rem}
.pf-cstats{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:.9375rem}
.pf-cstats b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:1.3rem;margin-inline-end:.3rem;font-variant-numeric:tabular-nums}
.pf-cstats .tot b{color:var(--pitch)}
.pf-note{margin:0;color:var(--ink-2);font-size:.9375rem}
.pf-thumbs img{height:5.5rem;width:auto;max-width:100%;border-radius:6px;display:block;cursor:zoom-in;border:1px solid var(--line);background:var(--surface)}

.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.pf-grid.one{grid-template-columns:minmax(0,1fr)}
.pf-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pf-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;min-width:0}
.pf-card h3{margin:0;font-size:1.0625rem;line-height:1.55;font-weight:700}
.pf-card p{margin:.3rem 0 0;color:var(--ink-2);font-size:.9375rem}
.pf-card p.pf-issuer{color:var(--pitch);font-weight:600}
.pf-card p.pf-k{margin:0 0 .15rem;color:var(--accent);font-weight:600;font-size:.875rem}
.pf-card p.pf-txt{color:var(--ink);margin:0}
.pf-date{display:inline-block;margin-top:.55rem;font-size:.8125rem;font-weight:600;background:var(--surface-2);border-radius:999px;padding:.05rem .7rem}

.pf-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr));gap:.6rem}
.pf-gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}

.pf-lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,12,9,.9);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pf-lb[hidden]{display:none!important}
.pf-lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.pf-lb button{position:absolute;width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;font-family:var(--f-body)}
.pf-lb button:hover{background:rgba(255,255,255,.3)}
.pf-lb button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pf-lb-x{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
.pf-lb-n{top:50%;left:max(12px,env(safe-area-inset-left,0px));transform:translateY(-50%)}
.pf-lb-p{top:50%;right:max(12px,env(safe-area-inset-right,0px));transform:translateY(-50%)}
.pf-lb-c{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--f-mono);font-size:.9rem;pointer-events:none}
.pf-lb-c:empty{display:none}
.pf-thumbs img,.pf-gal img{transition:transform .2s ease,filter .2s ease}
.pf-thumbs img:hover,.pf-gal img:hover{transform:translateY(-2px);filter:brightness(1.06)}
.pf :focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.pf-hero :focus-visible{outline-color:var(--hero-ink)}

.pf-nav{position:sticky;top:calc(var(--nav-top,env(safe-area-inset-top,0px)) + var(--brand-h,0px));z-index:10;display:flex;gap:.4rem;align-items:center;overflow-x:auto;padding-block:.5rem;margin-top:-1rem;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.pf-nav::-webkit-scrollbar{display:none}
.pf-chip{flex:none;font:inherit;font-weight:600;font-size:.875rem;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .95rem;min-height:2.25rem;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.pf-chip:hover{background:var(--surface-2);color:var(--ink)}
.pf-chip[aria-pressed="true"],.pf-chip[aria-current="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.pf-tools{flex:none;display:flex;gap:.4rem;position:sticky;inset-inline-start:0;z-index:2;background:var(--bg);padding-inline-end:.5rem}
.pf-theme{font-size:1.05rem;padding-inline:.8rem;min-width:2.6rem}
.pf-tools .pf-chip{flex:none}
.pf-lang{font-weight:700;letter-spacing:.02em;border-color:var(--pitch);color:var(--pitch)}
.pf[lang="en"]{--f-display:"Oswald","Lalezar",Impact,sans-serif}
.pf[lang="en"] .pf-name{text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.pf[lang="en"] .pf-h{letter-spacing:.01em}

.pf-copy{margin-inline-start:.5rem;font:inherit;font-size:.75rem;font-weight:600;color:var(--hero-ink);background:rgba(255,255,255,.14);border:1px solid var(--hero-line);border-radius:999px;padding:.05rem .7rem;cursor:pointer}
.pf-copy:hover{background:rgba(255,255,255,.26)}
.pf-toast{position:fixed;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1.2rem;border-radius:999px;font-size:.9rem;font-family:var(--f-body);z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.25)}


.pf-vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.pf-vids.one{grid-template-columns:minmax(0,1fr);max-width:46rem}
.pf-vid{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.pf-vid h3{margin:0;font-size:1.0625rem;line-height:1.5}
.pf-vframe{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1511;border:1px solid var(--line)}
.pf-vframe iframe,.pf-vframe video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.pf-vplay{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;background-color:#0b1511;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.pf-vtri{position:relative;width:4.5rem;height:3.2rem;border-radius:.9rem;background:var(--accent);transition:transform .15s}
.pf-vtri::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-35%,-50%);border-style:solid;border-width:.7rem 0 .7rem 1.15rem;border-color:transparent transparent transparent var(--on-accent)}
.pf-vplay:hover .pf-vtri{transform:scale(1.1)}
.pf-vhint{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;color:#fff;font-size:.8125rem;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.85);pointer-events:none}
.pf-vcard{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);background:var(--surface);font-size:.9rem;line-height:1.7;overflow:hidden}
.pf-vcard span{min-width:0;overflow-wrap:anywhere}
.pf-vlink{align-self:flex-start;color:var(--pitch);font-weight:600;font-size:.875rem;text-decoration:underline;text-underline-offset:3px}

.pf-brand{position:sticky;top:var(--nav-top,env(safe-area-inset-top,0px));z-index:12;display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-bottom:-1.25rem;padding:.45rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.pf-brand-id{display:flex;align-items:center;gap:.7rem;min-width:0;flex:1 1 auto}
.pf-brand-logo{height:3.4rem;width:auto;max-width:12rem;flex:none;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.15rem;display:block}
.pf-brand-txt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.pf-brand-txt strong{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-brand-txt span{color:var(--ink-2);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-brand-ph{flex:none;display:flex;flex-wrap:nowrap;align-items:center;gap:.25rem .5rem;font-size:.9375rem;white-space:nowrap}
.pf-brand-ph .pf-clabel{color:var(--ink-2);margin-inline-end:0}
.pf-brand-ph a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.pf-brand .pf-copy{color:var(--ink);background:var(--surface-2);border-color:var(--line);margin-inline-start:0}
.pf-brand .pf-copy:hover{background:var(--line)}
.pf-brand .pf-broken{min-height:2.2rem;min-width:0;max-width:8rem;font-size:.7rem;padding:.2rem .4rem}
.pf-foot{margin-top:.5rem;text-align:center;padding:1.9rem 1.25rem;border-radius:14px;color:var(--hero-ink);background:repeating-linear-gradient(90deg,var(--hero-a) 0 3.5rem,var(--hero-b) 3.5rem 7rem);display:flex;flex-direction:column;gap:.6rem;align-items:center}
.pf-quote{margin:0 0 .6rem;max-width:40rem;font-family:var(--f-display);font-size:clamp(1.15rem,3.6cqw,1.65rem);line-height:1.75;text-wrap:balance}
.pf[lang="en"] .pf-quote{font-family:var(--f-body);font-weight:500}
.pf-credit,.pf-fcontact{margin:0;color:var(--hero-ink-2);font-size:.9375rem}
.pf-credit strong{color:var(--hero-ink)}
.pf-foot a{color:inherit;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.pf-chip,.pf-vtri,.pf-thumbs img,.pf-gal img{transition:none}}

.pf-broken{display:flex;align-items:center;justify-content:center;text-align:center;min-height:5.5rem;min-width:8rem;max-width:14rem;padding:.6rem;border:1px dashed var(--line);border-radius:6px;font-size:.8125rem;line-height:1.5;color:var(--ink-2);background:var(--surface)}
.pf-gal .pf-broken{max-width:none;min-width:0;aspect-ratio:4/3}
.pf-portrait .pf-broken{max-width:none;width:100%;height:100%;border:0;border-radius:0;color:var(--hero-ink-2);background:transparent}

@media (min-width:80rem){ .pf-wrap{max-width:70rem} }
@media (min-width:100rem){ .pf-wrap{max-width:76rem} }
@container (min-width:64rem){
  .pf-hero-main{grid-template-columns:minmax(0,1fr) minmax(0,17rem);gap:3rem}
  .pf-clubs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pf-card{padding:1.15rem 1.3rem}
}
@container (min-width:72rem){ .pf-name{font-size:4.5rem} }
@container (max-width:42rem){ .pf-grid.three{grid-template-columns:minmax(0,1fr)} }
@container (max-width:44rem){ .pf-vids{grid-template-columns:minmax(0,1fr)} }
@container (max-width:40rem){
  .pf{gap:2rem}
  /* phone: keep the desktop arrangement, text beside the photo */
  .pf-hero-main{grid-template-columns:minmax(0,1fr) minmax(0,34%);column-gap:.85rem;row-gap:0;align-items:start;padding:1rem .85rem}
  .pf-hero-main>div{display:contents}
  .pf-eyebrow,.pf-name,.pf-license,.pf-focus{grid-column:1}
  .pf-eyebrow{font-size:.8125rem;margin-bottom:.15rem}
  .pf-name{font-size:clamp(1.45rem,7.6cqw,2.6rem)}
  .pf-license{font-size:.875rem;margin-top:.45rem}
  .pf-focus{font-size:.8125rem;line-height:1.55}
  .pf-portrait{grid-column:2;grid-row:1/span 4;max-width:none;width:100%;align-self:start}
  .pf-portrait::after{inset:.35rem}
  .pf-contacts{grid-column:1/-1;margin-top:.85rem;font-size:.8125rem;gap:.3rem 1rem}
  .pf-stat{padding:.6rem .2rem}
  .pf-stat dd{font-size:clamp(1.4rem,6.5cqw,2rem)}
  .pf-stat dt{font-size:.6875rem;line-height:1.35}
  .pf-grid{grid-template-columns:minmax(0,1fr)}
  .pf-clubs{grid-template-columns:minmax(0,1fr)}
  .pf-brand{padding:.35rem .55rem;gap:.4rem;border-radius:8px}
  .pf-brand-logo{height:2.9rem;max-width:7rem}
  .pf-brand-id{gap:.5rem}
  .pf-brand-txt strong{font-size:.875rem}
  .pf-brand-txt span{font-size:.6875rem}
  .pf-brand-ph .pf-clabel{display:none}
  .pf-brand-ph{font-size:.8125rem;gap:.3rem}
  .pf-brand .pf-copy{font-size:.6875rem;padding:.05rem .5rem}
}

        +(ph.length?'<div class="pf-cphotos">'+ph.map(function(p){return IMG(p,c.name,' data-zoom tabindex="0" data-grp="c'+i+'"');}).join('')+'</div>':'')
        +'<div class="pf-ctitle"><h3 dir="auto">'+esc(c.name)+'</h3>'+(c.tag?'<span class="pf-tag">'+esc(c.tag)+'</span>':'')+(c.period?'<span class="pf-when">'+ltr(c.period)+'</span>':'')+'</div></div>'
        +((gg||aa)?'<ul class="pf-cstats"><li><b>'+gg+'</b>'+esc(many(gg,U.goal))+'</li><li><b>'+aa+'</b>'+esc(many(aa,U.assist))+'</li><li class="tot"><b>'+(gg+aa)+'</b>'+esc(many(gg+aa,U.contrib))+'</li></ul>':'')
        +(c.note?'<p class="pf-note" dir="auto">'+esc(c.note)+'</p>':'')
        +'</li>';
    }).join('')+'</ul>');
  }

  if((s.achievements||[]).length) sec('achievements',T.achievements,'<div class="pf-grid">'+s.achievements.map(function(a){
    return '<article class="pf-card">'+(a.label?'<p class="pf-k" dir="auto">'+esc(a.label)+'</p>':'')+paras(a.text,'pf-txt')+'</article>';
  }).join('')+'</div>');

  if((s.certs||[]).length) sec('certs',T.certs,'<div class="pf-grid">'+s.certs.map(function(c){
    return '<article class="pf-card"><h3 dir="auto">'+esc(c.title)+'</h3>'
      +(c.issuer?'<p class="pf-issuer" dir="auto">'+esc(c.issuer)+'</p>':'')
      +(c.date?'<span class="pf-date" dir="auto">'+esc(c.date)+'</span>':'')
      +paras(c.details)+'</article>';
  }).join('')+'</div>');

  if((s.academic||[]).length) sec('academic',T.academic,'<div class="pf-grid one">'+s.academic.map(function(a){
    return '<article class="pf-card"><h3 dir="auto">'+esc(a.title)+'</h3>'+paras(a.details)+'</article>';
  }).join('')+'</div>');

  if((s.skills||[]).length) sec('skills',T.skills,'<div class="pf-grid three">'+s.skills.map(function(k){
    return '<article class="pf-card"><h3 dir="auto">'+esc(k.title)+'</h3>'+paras(k.text)+'</article>';
  }).join('')+'</div>');

  var gal=(s.gallery||[]).filter(okImg);
  if(gal.length) sec('gallery',T.gallery,'<div class="pf-gal">'+gal.map(function(p){return IMG(p,s.name,' data-zoom tabindex="0" data-grp="gal"');}).join('')+'</div>');

  var vids=(s.videos||[]).filter(function(v){return v&&videoInfo(v.url);});
  if(vids.length) sec('video',T.video,'<div class="pf-vids'+(vids.length===1?' one':'')+'">'+vids.map(function(v){return videoHTML(v,final,U);}).join('')+'</div>');

  var other=lang==='ar'?'en':'ar';
  var nav='<nav class="pf-nav" aria-label="'+esc(U.navLabel)+'"><span class="pf-tools">'
    +'<button type="button" class="pf-chip pf-lang" data-lang-toggle="'+other+'" lang="'+other+'" aria-label="'+esc(U.tglLabel)+'">'+esc(U.tgl)+'</button>'
    +'<button type="button" class="pf-chip pf-theme" data-theme-toggle aria-label="'+esc(U.theme)+'">◐</button></span>'
    +secs.map(function(x){return '<button type="button" class="pf-chip" data-nav="'+x.id+'">'+esc(x.label)+'</button>';}).join('')+'</nav>';
  var foot='';
  if(s.footer||br.name||br.phone){
    foot='<footer class="pf-foot">'+(s.footer?'<p class="pf-quote" dir="auto">'+esc(s.footer)+'</p>':'')
      +((br.name||br.role)?'<p class="pf-credit">'+esc(U.credit)+': <strong dir="auto">'+esc(br.name||'')+'</strong>'+(br.role?' '+esc(br.role):'')+'</p>':'')
      +(br.phone?'<p class="pf-fcontact">'+esc(U.contact)+': '+phoneEl(br.phone)+'</p>':'')+'</footer>';
  }
  return out+nav+secs.map(function(x){return x.html;}).join('')+foot+'</main></div>';
}
function initProfile(){
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var behavior=reduce?'auto':'smooth';
  var TX={
    ar:{copied:'تم النسخ',copyFail:'تعذّر النسخ',broken:'تعذّر تحميل الصورة من الرابط',ytHint:'يفتح على يوتيوب',close:'إغلاق',next:'التالي',prev:'السابق'},
    en:{copied:'Copied',copyFail:'Could not copy',broken:'The image could not be loaded from its link',ytHint:'Opens on YouTube',close:'Close',next:'Next',prev:'Previous'}
  };
  function tx(el,k){
    var n=(el&&el.closest)?el.closest('[lang]'):null;
    var l=(n&&n.getAttribute('lang')==='en')?'en':'ar';
    return TX[l][k];
  }

  /* lightbox with next / previous inside a photo group */
  var box=document.createElement('div');
  box.className='pf-lb'; box.hidden=true;
  box.innerHTML='<img alt=""><button type="button" class="pf-lb-x">×</button><button type="button" class="pf-lb-n">‹</button><button type="button" class="pf-lb-p">›</button><div class="pf-lb-c"></div>';
  document.body.appendChild(box);
  var im=box.querySelector('img'), cnt=box.querySelector('.pf-lb-c'), nb=box.querySelector('.pf-lb-n'), pb=box.querySelector('.pf-lb-p'), xb=box.querySelector('.pf-lb-x');
  var grp=[], idx=0, rtl=true;
  function show(){
    var t=grp[idx]; im.src=t.currentSrc||t.src;
    cnt.textContent=grp.length>1?(idx+1)+' / '+grp.length:'';
    nb.hidden=grp.length<2; pb.hidden=grp.length<2;
  }
  function open(t){
    var g=t.getAttribute('data-grp');
    grp=g?$$('img[data-zoom][data-grp="'+g+'"]'):[t];
    idx=Math.max(0,grp.indexOf(t));
    rtl=window.getComputedStyle(t).direction==='rtl';
    xb.setAttribute('aria-label',tx(t,'close'));
    nb.setAttribute('aria-label',tx(t,rtl?'next':'prev'));
    pb.setAttribute('aria-label',tx(t,rtl?'prev':'next'));
    show(); box.hidden=false;
  }
  function step(d){ if(grp.length<2) return; idx=(idx+d+grp.length)%grp.length; show(); }
  function left(){ step(rtl?1:-1); }
  function right(){ step(rtl?-1:1); }
  var x0=null;
  box.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  box.addEventListener('touchend',function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50){ if(dx>0) left(); else right(); }
  },{passive:true});

  /* images that fail to load from a link */
  function swap(t){
    var s=document.createElement('span'); s.className='pf-broken';
    var bm=window.__brokenMsg, n=t.closest?t.closest('[lang]'):null, l=(n&&n.getAttribute('lang')==='en')?'en':'ar';
    s.textContent=(bm&&typeof bm==='object')?(bm[l]||tx(t,'broken')):(bm||tx(t,'broken'));
    t.replaceWith(s);
  }
  function sweep(){
    $$('img[data-remote]').forEach(function(i){ if(i.complete&&i.naturalWidth===0) swap(i); });
  }
  document.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t.tagName==='IMG'&&t.hasAttribute('data-remote')) swap(t);
  },true);

  /* small toast + copy */
  var tTimer=null;
  function toast(m){
    var t=document.querySelector('.pf-toast');
    if(!t){ t=document.createElement('div'); t.className='pf-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
    t.textContent=m; t.hidden=false;
    clearTimeout(tTimer); tTimer=setTimeout(function(){ t.hidden=true; },1800);
  }
  function copy(v,from){
    function ok(){ toast(tx(from,'copied')); }
    function fb(){
      try{
        var ta=document.createElement('textarea'); ta.value=v; ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta); ta.select();
        var r=document.execCommand('copy'); document.body.removeChild(ta);
        if(r) ok(); else toast(tx(from,'copyFail'));
      }catch(e){ toast(tx(from,'copyFail')); }
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(ok,fb); } else { fb(); }
  }

  /* stat counters */
  function countUp(){
    $$('.pf-stat dd[data-count]').forEach(function(d){
      var to=+d.getAttribute('data-count')||0;
      if(reduce||to===0){ d.textContent=to; return; }
      var t0=null, dur=800;
      function f(ts){
        if(t0===null) t0=ts;
        var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
        d.textContent=Math.round(to*e);
        if(p<1) requestAnimationFrame(f); else d.textContent=to;
      }
      d.textContent='0'; requestAnimationFrame(f);
      setTimeout(function(){ d.textContent=to; },dur+400);
    });
  }

  /* the sticky brand bar pushes the section nav down by its own height */
  function measure(){
    var b=document.querySelector('.pf-brand');
    var h=b?Math.max(0,Math.ceil(b.getBoundingClientRect().height)-1):0;
    document.documentElement.style.setProperty('--brand-h',h+'px');
  }

  /* section nav: highlight the section being read */
  var lastAct=null;
  function spy(){
    var nav=document.querySelector('.pf-nav'); if(!nav) return;
    var secs=$$('.pf-sec[id]'); if(!secs.length) return;
    var line=nav.getBoundingClientRect().bottom+16, cur=null;
    secs.forEach(function(s){ if(s.getBoundingClientRect().top<=line) cur=s.id; });
    if(window.innerHeight+window.pageYOffset>=document.documentElement.scrollHeight-4) cur=secs[secs.length-1].id;
    $$('.pf-nav [data-nav]').forEach(function(b){
      if(b.getAttribute('data-nav')===cur) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current');
    });
    var act=nav.querySelector('[aria-current="true"]');
    if(act&&act!==lastAct){
      lastAct=act;
      var nr=nav.getBoundingClientRect(), ar=act.getBoundingClientRect();
      if((ar.left<nr.left||ar.right>nr.right)&&nav.scrollBy) nav.scrollBy({left:(ar.left+ar.right)/2-(nr.left+nr.right)/2,behavior:behavior});
    }
  }
  var raf=0;
  function onScroll(){ if(raf) return; raf=requestAnimationFrame(function(){ raf=0; spy(); }); }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){ measure(); onScroll(); });

  function run(){
    lastAct=null; measure(); countUp(); sweep(); spy();
    if(!/^https?:$/.test(location.protocol)){
      $$('[data-yt]').forEach(function(b){
        if(!b.querySelector('.pf-vhint')){ var s=document.createElement('span'); s.className='pf-vhint'; s.textContent=tx(b,'ytHint'); b.appendChild(s); }
      });
    }
  }
  window.__pfRefresh=run;

  document.addEventListener('click',function(e){
    var t=e.target; if(!t||!t.closest) return;
    if(!box.hidden){
      if(t===box||t.closest('.pf-lb-x')) box.hidden=true;
      else if(t.closest('.pf-lb-n')) left();
      else if(t.closest('.pf-lb-p')) right();
      return;
    }
    if(t.matches('img[data-zoom]')){ open(t); return; }
    var b;
    if((b=t.closest('[data-nav]'))){
      var s=document.getElementById(b.getAttribute('data-nav'));
      if(s) s.scrollIntoView({behavior:behavior,block:'start'});
      return;
    }
    if((b=t.closest('[data-copy]'))){ copy(b.getAttribute('data-copy'),b); return; }
    if((b=t.closest('[data-lang-toggle]'))){ if(window.__pfSetLang) window.__pfSetLang(b.getAttribute('data-lang-toggle')); return; }
    if((b=t.closest('[data-yt]'))){
      var yid=b.getAttribute('data-yt');
      if(/^[\w-]{11}$/.test(yid)){
        if(!/^https?:$/.test(location.protocol)){ window.open('https://www.youtube.com/watch?v='+yid,'_blank','noopener'); return; }
        var fr=document.createElement('iframe');
        fr.referrerPolicy='strict-origin-when-cross-origin';
        fr.src='https://www.youtube-nocookie.com/embed/'+yid+'?autoplay=1&rel=0';
        fr.title=b.getAttribute('aria-label')||'Video'; fr.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; fr.allowFullscreen=true;
        b.parentNode.replaceChild(fr,b);
      }
      return;
    }
    if(t.closest('[data-theme-toggle]')){
      var el=document.documentElement, cur=el.getAttribute('data-theme');
      var dark=cur==='dark'||(!cur&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      el.setAttribute('data-theme',dark?'light':'dark');
    }
  });
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(!box.hidden){
      if(e.key==='Escape') box.hidden=true;
      else if(e.key==='ArrowLeft') left();
      else if(e.key==='ArrowRight') right();
      return;
    }
    if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('img[data-zoom]')){ e.preventDefault(); open(t); }
  });
  document.addEventListener('load',function(e){
    var t=e.target;
    if(t&&t.classList&&t.classList.contains('pf-brand-logo')) measure();
  },true);

  run();
  window.addEventListener('load',function(){ measure(); sweep(); spy(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ measure(); spy(); });
}
var D=JSON.parse(document.getElementById("pf-data").textContent);
var root=document.getElementById("pf-root"), cur="";
function render(l){
  cur=l; root.innerHTML=profileHTML(D,true,l);
  var U=UI[l], de=document.documentElement; de.lang=l; de.dir=U.dir;
  var m=l==="en"?mergeEN(D):D; document.title=U.title.replace("{n}",m.name||"");

}

initProfile();
var first=/[#&]en\b/.test(location.hash)?"en":(/[#&]ar\b/.test(location.hash)?"ar":"");
if(!first){ try{ first=localStorage.getItem("pf-lang")||""; }catch(e){} }
render(first==="en"?"en":"ar");
})();</script></body></html>
